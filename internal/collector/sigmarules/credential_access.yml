# lrng starter pack — credential access.
title: LSASS Memory Dump Command
id: lrng-cred-0030
status: stable
description: A command line dumping LSASS memory (comsvcs MiniDump or procdump against lsass).
logsource:
    category: process_creation
    product: windows
detection:
    comsvcs:
        CommandLine|contains|all:
            - 'comsvcs'
            - 'minidump'
    procdump:
        CommandLine|contains|all:
            - 'procdump'
            - 'lsass'
    condition: comsvcs or procdump
tags:
    - attack.credential_access
    - attack.t1003.001
level: critical
---
title: Credential Dumping Tool Keywords
id: lrng-cred-0031
status: stable
description: PowerShell script text naming a well-known credential-theft tool.
logsource:
    service: powershell
detection:
    keywords:
        - 'Invoke-Mimikatz'
        - 'sekurlsa'
        - 'DumpCreds'
        - 'Rubeus'
        - 'SafetyKatz'
        - 'Invoke-Kerberoast'
    condition: keywords
tags:
    - attack.credential_access
    - attack.t1003.001
level: critical
---
title: Failed Logon Burst From Single Source
id: lrng-cred-0032
status: stable
description: More than ten failed logons (4625) from one source address within five minutes — a brute-force burst, as opposed to ten scattered typos over a week.
logsource:
    service: security
detection:
    selection:
        EventID: 4625
    timeframe: 5m
    condition: selection | count() by IpAddress > 10
tags:
    - attack.credential_access
    - attack.t1110.001
level: medium
---
title: Password Spray From Single Source
id: lrng-cred-0033
status: stable
description: One source address failing to log on against more than ten distinct accounts within five minutes — the wide, shallow pattern of a password spray, distinct from a brute force against one account.
logsource:
    service: security
detection:
    selection:
        EventID: 4625
    timeframe: 5m
    condition: selection | count(TargetUserName) by IpAddress > 10
tags:
    - attack.credential_access
    - attack.t1110.003
level: medium
